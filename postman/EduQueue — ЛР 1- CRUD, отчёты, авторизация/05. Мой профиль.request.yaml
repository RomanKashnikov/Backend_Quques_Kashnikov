$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Хеш пароля скрыт", () => pm.expect(pm.response.json()).not.to.have.property("passwordHash"));
    language: text/javascript
order: 5000
