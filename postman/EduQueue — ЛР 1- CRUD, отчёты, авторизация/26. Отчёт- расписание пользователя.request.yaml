$kind: http-request
name: "26. Отчёт: расписание пользователя"
url: "{{baseUrl}}/api/reports/users/{{testUserId}}/schedule"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Одна запись", () => pm.expect(pm.response.json().schedule.length).to.eql(1));
    language: text/javascript
order: 26000
