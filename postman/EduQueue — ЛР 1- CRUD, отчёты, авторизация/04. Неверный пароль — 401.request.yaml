$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "passNumber": "100001",
      "password": "wrong-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
