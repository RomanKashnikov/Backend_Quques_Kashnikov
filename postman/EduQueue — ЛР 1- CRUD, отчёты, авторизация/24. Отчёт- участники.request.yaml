$kind: http-request
name: "24. Отчёт: участники"
url: "{{baseUrl}}/api/reports/queues/{{testQueueId}}/participants"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Место 1", () => pm.expect(pm.response.json().participants[0].position).to.eql(1));
    language: text/javascript
order: 24000
